---
- name: Prepare local host
  hosts: local
  gather_facts: true

  vars:
    target_user: "{{ ansible_user_id }}"
    project_root: "{{ playbook_dir }}/.."
    image_name: yadro-http-checker
    container_name: yadro-http-checker-container
    http_status_base_url: https://tools-httpstatus.pickup-services.com

    required_log_items:
      - "requested_status_code=102"
      - "requested_status_code=200"
      - "requested_status_code=302"
      - "requested_status_code=404"
      - "requested_status_code=500"

    docker_packages_debian:
      - docker.io
      - python3
      - python3-pip
      - ca-certificates

    docker_packages_redhat:
      - moby-engine
      - python3
      - python3-pip
      - ca-certificates

  tasks:
    - name: Show target system
      ansible.builtin.debug:
        msg: "Target system: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})"

    - name: Show current user
      ansible.builtin.debug:
        msg: "Current user: {{ target_user }}"

    - name: Choose Docker packages for Debian family
      ansible.builtin.set_fact:
        docker_packages: "{{ docker_packages_debian }}"
      when: ansible_os_family == "Debian"

    - name: Choose Docker packages for RedHat family
      ansible.builtin.set_fact:
        docker_packages: "{{ docker_packages_redhat }}"
      when: ansible_os_family == "RedHat"

    - name: Stop if OS family is not supported
      ansible.builtin.fail:
        msg: "Unsupported OS family: {{ ansible_os_family }}"
      when: docker_packages is not defined

    - name: Show selected Docker packages
      ansible.builtin.debug:
        msg: "Docker packages: {{ docker_packages }}"

    - name: Check Docker before install
      ansible.builtin.command:
        cmd: docker --version
      register: docker_before
      changed_when: false
      failed_when: false

    - name: Install Docker and required packages
      ansible.builtin.package:
        name: "{{ docker_packages }}"
        state: present
      become: true

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present
      become: true

    - name: Add current user to docker group
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true
      become: true
      when: target_user != "root"

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      become: true

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Check Docker service state
      ansible.builtin.command:
        cmd: systemctl is-active docker
      register: docker_service_state
      changed_when: false

    - name: Show Docker service state
      ansible.builtin.debug:
        msg: "docker.service is {{ docker_service_state.stdout }}"

    - name: Check Docker service autostart
      ansible.builtin.command:
        cmd: systemctl is-enabled docker
      register: docker_service_enabled
      changed_when: false

    - name: Show Docker service autostart
      ansible.builtin.debug:
        msg: "docker.service is {{ docker_service_enabled.stdout }}"

    - name: Check Dockerfile exists
      ansible.builtin.stat:
        path: "{{ project_root }}/docker/Dockerfile"
      register: dockerfile_stat

    - name: Stop if Dockerfile is missing
      ansible.builtin.fail:
        msg: "Dockerfile not found: {{ project_root }}/docker/Dockerfile"
      when: not dockerfile_stat.stat.exists

    - name: Build Docker image
      ansible.builtin.command:
        cmd: docker build -f docker/Dockerfile -t "{{ image_name }}" .
        chdir: "{{ project_root }}"
      become: true

    - name: Check Docker image
      ansible.builtin.command:
        cmd: docker image inspect "{{ image_name }}:latest"
      register: docker_image_info
      changed_when: false
      become: true

    - name: Show Docker image status
      ansible.builtin.debug:
        msg: "Docker image {{ image_name }}:latest is available"

    - name: Remove old checker container
      ansible.builtin.command:
        cmd: docker rm -f "{{ container_name }}"
      register: remove_container
      changed_when: remove_container.rc == 0
      failed_when: false
      become: true

    - name: Run checker container
      ansible.builtin.command:
        cmd: >
          docker run
          --name "{{ container_name }}"
          -e HTTP_STATUS_BASE_URL="{{ http_status_base_url }}"
          "{{ image_name }}"
      register: container_run
      become: true

    - name: Show container run result
      ansible.builtin.debug:
        msg: "Container {{ container_name }} finished with return code {{ container_run.rc }}"

    - name: Check container exit code
      ansible.builtin.command:
        cmd: >
          docker inspect "{{ container_name }}"
          --format '{% raw %}{{.State.ExitCode}}{% endraw %}'
      register: container_exit_code
      changed_when: false
      become: true

    - name: Stop if container exit code is not zero
      ansible.builtin.fail:
        msg: "Container {{ container_name }} finished with exit code {{ container_exit_code.stdout }}"
      when: container_exit_code.stdout != "0"

    - name: Read container logs
      ansible.builtin.shell:
        cmd: docker logs "{{ container_name }}" 2>&1
      register: container_logs
      changed_when: false
      become: true

    - name: Show container logs
      ansible.builtin.debug:
        var: container_logs.stdout_lines

    - name: Check required log items
      ansible.builtin.assert:
        that:
          - item in container_logs.stdout
        fail_msg: "Log item not found: {{ item }}"
        success_msg: "Log item found: {{ item }}"
      loop: "{{ required_log_items }}"

    - name: Show final check result
      ansible.builtin.debug:
        msg: "Container logs were checked successfully"
