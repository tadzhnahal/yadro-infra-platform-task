---
- name: Check container exit code
  ansible.builtin.command:
    cmd: >
      docker inspect "{{ container_name }}"
      --format '{% raw %}{{.State.ExitCode}}{% endraw %}'
  register: container_exit_code
  changed_when: false
  become: true

- name: Stop if container exit code is not zero
  ansible.builtin.fail:
    msg: "Container {{ container_name }} finished with exit code {{ container_exit_code.stdout }}"
  when: container_exit_code.stdout != "0"

- name: Read container logs
  ansible.builtin.shell:
    cmd: docker logs "{{ container_name }}" 2>&1
  register: container_logs
  changed_when: false
  become: true

- name: Show container logs
  ansible.builtin.debug:
    var: container_logs.stdout_lines

- name: Check required log items
  ansible.builtin.assert:
    that:
      - item in container_logs.stdout
    fail_msg: "Log item not found: {{ item }}"
    success_msg: "Log item found: {{ item }}"
  loop: "{{ required_log_items }}"

- name: Show final check result
  ansible.builtin.debug:
    msg: "Container logs were checked successfully"
