---
- name: Prepare local host
  hosts: local
  gather_facts: true

  vars:
    target_user: "{{ ansible_user_id }}"
    project_root: "{{ playbook_dir }}/.."
    image_name: yadro-http-checker
    container_name: yadro-http-checker-container
    http_status_base_url: https://tools-httpstatus.pickup-services.com

    required_log_items:
      - "requested_status_code=102"
      - "requested_status_code=200"
      - "requested_status_code=302"
      - "requested_status_code=404"
      - "requested_status_code=500"

    docker_packages_debian:
      - docker.io
      - python3
      - python3-pip
      - ca-certificates

    docker_packages_redhat:
      - moby-engine
      - python3
      - python3-pip
      - ca-certificates

  tasks:
    - name: Prepare Docker
      ansible.builtin.import_tasks: tasks/prepare_docker.yml

    - name: Build Docker image
      ansible.builtin.import_tasks: tasks/build_image.yml

    - name: Run checker container
      ansible.builtin.import_tasks: tasks/run_container.yml

    - name: Check checker container
      ansible.builtin.import_tasks: tasks/check_container.yml
